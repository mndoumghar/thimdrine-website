<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contactez la coopérative Thimdrine pour une question ou une commande.">
    <title>Contact - Coopérative Thimdrine</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <header>
        <nav>
            <ul class="nav-list">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="produits.html">Nos produits</a></li>
                <li><a href="apropos.html">A propos</a></li>
                <li><a href="contact.html" class="active" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1 class="page-title">CONTACT</h1>

        <section class="contact">

            <form class="contact-form" action="mailto:thmdrinsupport@gmail.com" method="post" enctype="text/plain">
                <div>
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" required>
                </div>
                <div>
                    <label for="telephone">Téléphone</label>
                    <input type="tel" id="telephone" name="telephone">
                </div>
                <div>
                    <label for="message">Votre message ou commande de produit</label>
                    <textarea id="message" name="message" rows="6" maxlength= "120" required></textarea>
                </div>
                <button class="btn" type="submit">Envoyer</button>
            </form>

            <div class="contact-info">
                <h2>Nos coordonnées</h2>
                <p><i class="fa-solid fa-phone"></i> +212 777 888 225</p>
                <p><i class="fa-regular fa-envelope-open"></i> thmdrinsupport@gmail.com</p>
                <p><i class="fa-solid fa-location-dot"></i> Coopérative Thimdrine, Nador</p>
            </div>

        </section>

    </main>

    <footer class="footer">

        <div class="footer-col">
            <div class="footer-logo">THIMDRINE</div>
            <a href="apropos.html">A propos</a>
            <a href="contact.html">Contact</a>
            <span>+212 777 888 225</span>
        </div>

        <div class="footer-col">
            <a class="btn btn-footer" href="contact.html">Nous contacter</a>
        </div>

        <div class="footer-col">
            <div><i class="fa-solid fa-circle-info"></i> Information</div>
            <div>Coopérative à Nador</div>
            <div><i class="fa-regular fa-envelope-open"></i> thmdrinsupport@gmail.com</div>
            <div><i class="fa-brands fa-creative-commons-sa"></i> 2026</div>
        </div>

    </footer>

</body>

</html>
